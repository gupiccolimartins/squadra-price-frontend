services:
  - type: web
    name: squadra-price-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_IMG_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
